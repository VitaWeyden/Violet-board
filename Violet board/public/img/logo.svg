<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 244 48">
    <defs>
        <linearGradient id="vbGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#7C3AED"/>
            <stop offset="1" stop-color="#5B21B6"/>
        </linearGradient>
    </defs>

    <!-- Mark -->
    <rect x="0" y="0" width="48" height="48" rx="11" fill="url(#vbGrad)"/>
    <circle cx="15" cy="15" r="3.4" fill="#FFFFFF"/>
    <circle cx="33" cy="15" r="3.4" fill="#FFFFFF"/>
    <circle cx="24" cy="24" r="3.4" fill="#FFFFFF"/>
    <circle cx="15" cy="33" r="3.4" fill="#FFFFFF"/>
    <circle cx="33" cy="33" r="3.4" fill="#FFFFFF"/>

    <!-- Wordmark — single typeface (Inter), two-tone for brand emphasis -->
    <text x="64" y="32" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="26" letter-spacing="-0.3">
        <tspan fill="#2B2B3A">Violet</tspan><tspan fill="#7C3AED">Board</tspan>
    </text>
</svg>
